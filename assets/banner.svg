<svg width="1200" height="320" viewBox="0 0 1200 320" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A0E27"/>
      <stop offset="55%" stop-color="#141833"/>
      <stop offset="100%" stop-color="#1B1440"/>
    </linearGradient>
    <linearGradient id="nameGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7C6CF0"/>
      <stop offset="50%" stop-color="#5EA8F5"/>
      <stop offset="100%" stop-color="#4FD6D0"/>
    </linearGradient>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7C6CF0" stop-opacity="0"/>
      <stop offset="50%" stop-color="#5EA8F5" stop-opacity="1"/>
      <stop offset="100%" stop-color="#4FD6D0" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#5EA8F5" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#5EA8F5" stop-opacity="0"/>
    </radialGradient>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- background -->
  <rect width="1200" height="320" fill="url(#bg)"/>

  <!-- ambient glow -->
  <circle cx="980" cy="90" r="260" fill="url(#glow)"/>
  <circle cx="140" cy="270" r="200" fill="url(#glow)" opacity="0.6"/>

  <!-- faint dot grid -->
  <g opacity="0.18">
    <g fill="#5EA8F5">
      <circle cx="60" cy="40" r="1.4"/><circle cx="100" cy="40" r="1.4"/><circle cx="140" cy="40" r="1.4"/>
      <circle cx="60" cy="80" r="1.4"/><circle cx="100" cy="80" r="1.4"/><circle cx="140" cy="80" r="1.4"/>
      <circle cx="1060" cy="250" r="1.4"/><circle cx="1100" cy="250" r="1.4"/><circle cx="1140" cy="250" r="1.4"/>
      <circle cx="1060" cy="285" r="1.4"/><circle cx="1100" cy="285" r="1.4"/><circle cx="1140" cy="285" r="1.4"/>
    </g>
  </g>

  <!-- neural-net motif, right side -->
  <g stroke="#5EA8F5" stroke-width="1" opacity="0.55">
    <line x1="905" y1="95" x2="985" y2="60"/>
    <line x1="905" y1="95" x2="985" y2="120"/>
    <line x1="905" y1="95" x2="985" y2="180"/>
    <line x1="905" y1="175" x2="985" y2="60"/>
    <line x1="905" y1="175" x2="985" y2="120"/>
    <line x1="905" y1="175" x2="985" y2="180"/>
    <line x1="985" y1="60" x2="1065" y2="100"/>
    <line x1="985" y1="120" x2="1065" y2="100"/>
    <line x1="985" y1="180" x2="1065" y2="100"/>
    <line x1="985" y1="60" x2="1065" y2="160"/>
    <line x1="985" y1="120" x2="1065" y2="160"/>
    <line x1="985" y1="180" x2="1065" y2="160"/>
  </g>
  <g fill="#0A0E27" stroke="url(#nameGrad)" stroke-width="1.6">
    <circle cx="905" cy="95" r="6"/>
    <circle cx="905" cy="175" r="6"/>
    <circle cx="985" cy="60" r="6"/>
    <circle cx="985" cy="120" r="6"/>
    <circle cx="985" cy="180" r="6"/>
    <circle cx="1065" cy="100" r="6"/>
    <circle cx="1065" cy="160" r="6"/>
  </g>

  <!-- eyebrow -->
  <text x="90" y="108" font-family="Consolas, Monaco, 'Courier New', monospace" font-size="16" fill="#4FD6D0" letter-spacing="4">&lt; AI/ML · FULL-STACK DEVELOPER /&gt;</text>

  <!-- name -->
  <text x="88" y="185" font-family="'Trebuchet MS', 'Segoe UI', Verdana, sans-serif" font-size="76" font-weight="700" fill="url(#nameGrad)" filter="url(#softGlow)">Sugandh Mahajan</text>

  <!-- accent underline -->
  <rect x="90" y="205" width="560" height="3" fill="url(#lineGrad)"/>

  <!-- tagline -->
  <text x="90" y="248" font-family="Consolas, Monaco, 'Courier New', monospace" font-size="19" fill="#B9C2E0">B.Tech CSE (AI/ML) @ MIET Meerut  ·  Training models, shipping full-stack AI products</text>

  <!-- corner bracket accents -->
  <g stroke="#4FD6D0" stroke-width="2" fill="none" opacity="0.8">
    <path d="M 40 20 L 20 20 L 20 40"/>
    <path d="M 1160 20 L 1180 20 L 1180 40"/>
    <path d="M 40 300 L 20 300 L 20 280"/>
    <path d="M 1160 300 L 1180 300 L 1180 280"/>
  </g>
</svg>
